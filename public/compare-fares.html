<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Fares | swiftCab</title>
    <link rel="stylesheet" href="css/passenger.css">
</head>

<body>

<header class="topbar">
    <nav class="nav">

        <a class="brand" href="passenger-dashboard.html">
            swift<span>Cab.</span>
        </a>

        <div class="navlinks">
            <a href="passenger-dashboard.html" data-page="passenger-dashboard">Dashboard</a>
            <a href="book-ride.html" data-page="book-ride">Book ride</a>
            <a href="compare-fares.html" data-page="compare-fares">Compare fares</a>
            <a href="schedule-ride.html" data-page="schedule-ride">Schedule</a>
            <a href="preferred-drivers.html" data-page="preferred-drivers">Drivers</a>
            <a href="ride-history.html" data-page="ride-history">History</a>
        </div>

    </nav>
</header>

<main class="container" data-page="compare-fares">

    <div class="eyebrow">Transparent pricing</div>

    <h1>Compare your fares</h1>

    <p>Choose the ride that fits your route and budget.</p>

    <section class="card">

        <form id="fare-form" class="form-grid">

            <div class="field">
                <label for="fare-pickup">Pickup</label>

                <input
                    id="fare-pickup"
                    placeholder="Pickup location"
                    required
                >
            </div>

            <div class="field">
                <label for="fare-drop">Destination</label>

                <input
                    id="fare-drop"
                    placeholder="Drop location"
                    required
                >
            </div>

            <div class="field">
                <label for="fare-distance">Distance (km)</label>

                <input
                    id="fare-distance"
                    type="number"
                    min="1"
                    step="0.1"
                    value="10"
                    required
                >
            </div>

            <div class="field" style="align-self:end">

                <button type="submit">
                    Calculate fares
                </button>

            </div>

        </form>

    </section>

    <div
        id="fare-results"
        class="grid"
        style="margin-top:18px"
    ></div>

</main>

<footer class="footer">
    swiftCab · Passenger portal · Demo interface
</footer>

<script src="js/passenger.js"></script>

</body>
</html>
