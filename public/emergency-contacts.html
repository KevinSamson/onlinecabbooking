<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Astercab — a better way to move." />
    <title>Emergency contacts | Astercab</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="emergency-contacts">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation"></nav>
        <div class="nav-actions" data-nav-auth></div>
        <button
          class="icon-btn mobile-toggle"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>
    <main class="page">
      <div class="container">
        <div class="page-head">
          <div>
            <div class="eyebrow">Your safety circle</div>
            <h1>People you trust.</h1>
            <p class="muted">
              Keep important people close, wherever the road takes you.
            </p>
          </div>
          <span class="badge badge-active" id="contact-count">
            Loading contacts
          </span>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(270px, 1fr);
            gap: 22px;
          "
          class="contacts-layout"
        >
          <section>
            <div id="contacts" class="contact-grid">
              <div class="loading">Loading contacts…</div>
            </div>
          </section>
          <aside class="card" style="align-self: start">
            <h3 id="form-title">Add a contact</h3>
            <p class="card-sub">Choose someone who should be easy to reach.</p>
            <form id="contact-form">
              <div class="form-group">
                <label for="name">Full name</label>
                <input
                  class="input"
                  id="name"
                  name="name"
                  placeholder="e.g. Priya Sharma"
                  required
                  minlength="2"
                  maxlength="120"
                />
              </div>
              <div class="form-group">
                <label for="phone">Phone number</label>
                <input
                  class="input"
                  id="phone"
                  name="phone"
                  type="tel"
                  placeholder="+91 98765 43210"
                  required
                />
              </div>
              <div class="form-group">
                <label for="relationship">Relationship</label>
                <input
                  class="input"
                  id="relationship"
                  name="relationship"
                  placeholder="e.g. Family, friend"
                  required
                  minlength="2"
                  maxlength="80"
                />
              </div>
              <div class="inline-row">
                <button class="btn btn-primary" type="submit">
                  Save contact
                  <i data-lucide="arrow-right" size="17"></i>
                </button>
                <button
                  class="btn btn-ghost"
                  type="button"
                  id="cancel-edit"
                  hidden
                >
                  Cancel
                </button>
              </div>
            </form>
          </aside>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="container footer-inner">
        <a class="brand" href="/">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          astercab
        </a>
        <span>Thoughtful journeys, every day. © 2026 Astercab</span>
        <span>Built with OpenStreetMap</span>
      </div>
    </footer>
    <div class="toast-stack" aria-live="polite"></div>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
