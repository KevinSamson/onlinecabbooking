<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astercab · Driver</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  </head>
  <body data-page="driver-vehicles">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation"></nav>
        <div class="nav-actions" data-nav-auth></div>
        <button
          class="icon-btn mobile-toggle"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="side-title">Driver workspace</div>
        <nav data-driver-nav></nav>
        <div class="divider"></div>
        <a class="side-link" href="/driver-verification.html">
          <i data-lucide="shield-check"></i>
          Verification
        </a>
        <button class="side-link" data-logout>
          <i data-lucide="log-out"></i>
          Sign out
        </button>
      </aside>
      <main class="dashboard-main">
        <div class="dashboard-top">
          <div>
            <div class="eyebrow">Astercab driver</div>
            <h1 id="driver-title">My vehicles</h1>
          </div>
          <div class="user-chip" data-user-chip></div>
        </div>
        <div class="card" style="margin-bottom: 22px">
          <h3>Register a vehicle</h3>
          <p class="card-sub">
            New vehicles are submitted to an administrator for approval.
          </p>
          <form id="vehicle-form">
            <div class="form-grid">
              <div class="form-group">
                <label>Make</label>
                <input
                  class="input"
                  name="make"
                  required
                  maxlength="80"
                  placeholder="e.g. Maruti"
                />
              </div>
              <div class="form-group">
                <label>Model</label>
                <input
                  class="input"
                  name="model"
                  required
                  maxlength="80"
                  placeholder="e.g. Swift"
                />
              </div>
              <div class="form-group">
                <label>Colour</label>
                <input class="input" name="color" required maxlength="50" />
              </div>
              <div class="form-group">
                <label>Registration number</label>
                <input
                  class="input"
                  name="plate_number"
                  required
                  maxlength="30"
                  placeholder="TN 00 AB 1234"
                />
              </div>
              <div class="form-group">
                <label>Category</label>
                <select class="select" name="category">
                  <option value="economy">Economy</option>
                  <option value="comfort">Comfort</option>
                  <option value="premium">Premium</option>
                  <option value="xl">XL</option>
                </select>
              </div>
              <div class="form-group">
                <label>Seats</label>
                <input
                  class="input"
                  type="number"
                  name="seats"
                  min="1"
                  max="20"
                  value="4"
                  required
                />
              </div>
            </div>
            <button class="btn btn-primary" type="submit">
              Submit vehicle
            </button>
          </form>
        </div>
        <div class="page-head"><h2>Registered vehicles</h2></div>
        <div id="vehicle-list" class="feature-grid">
          <div class="loading">Loading vehicles…</div>
        </div>
      </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/driver.js"></script>
  </body>
</html>
