<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preferred Drivers | Astercab</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/passenger.css" />
  </head>

  <body data-page="preferred-drivers">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation"></nav>
        <div class="nav-actions" data-nav-auth></div>
        <button
          class="icon-btn mobile-toggle"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <main class="container" data-page="preferred-drivers">
      <div class="eyebrow">Your trusted list</div>

      <h1>Preferred drivers</h1>

      <p>Drivers you have chosen after previous trips.</p>

      <section class="card">
        <div class="notice">
          Save an approved driver you would like to recognize again. Ride
          requests are still available to any eligible driver.
        </div>

        <div id="preferred-list"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <span>Thoughtful journeys, every day. © 2026 Astercab</span>
      </div>
    </footer>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/passenger.js"></script>
  </body>
</html>
