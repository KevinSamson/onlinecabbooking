<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare Fares | Astercab</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/passenger.css" />
  </head>

  <body data-page="compare-fares">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation"></nav>
        <div class="nav-actions" data-nav-auth></div>
        <button
          class="icon-btn mobile-toggle"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <main class="container" data-page="compare-fares">
      <div class="eyebrow">Transparent pricing</div>

      <h1>Compare your fares</h1>

      <p>Choose the ride that fits your route and budget.</p>

      <section class="card">
        <form id="fare-form" class="form-grid">
          <div class="field">
            <label for="fare-pickup">Pickup</label>

            <input
              class="input"
              id="fare-pickup"
              placeholder="Pickup location"
              required
            />
          </div>

          <div class="field">
            <label for="fare-drop">Destination</label>

            <input
              class="input"
              id="fare-drop"
              placeholder="Drop location"
              required
            />
          </div>

          <div class="field">
            <label for="fare-distance">Distance (km)</label>

            <input
              class="input"
              id="fare-distance"
              type="number"
              min="1"
              step="0.1"
              value="10"
              required
            />
          </div>

          <div class="field" style="align-self: end">
            <button class="btn btn-primary" type="submit">
              Calculate fares
            </button>
          </div>
        </form>
      </section>

      <div id="fare-results" class="grid" style="margin-top: 18px"></div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <span>Thoughtful journeys, every day. © 2026 Astercab</span>
      </div>
    </footer>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/passenger.js"></script>
  </body>
</html>
