<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule a Ride | Astercab</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/passenger.css" />
  </head>

  <body data-page="schedule-ride">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation"></nav>
        <div class="nav-actions" data-nav-auth></div>
        <button
          class="icon-btn mobile-toggle"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <main class="container" data-page="schedule-ride">
      <div class="eyebrow">Ride later</div>

      <h1>Schedule a ride</h1>

      <p>Set a future pickup date and time.</p>

      <div class="grid">
        <section class="card span-7">
          <form id="schedule-form">
            <div class="field">
              <label for="schedule-pickup">Pickup location</label>

              <input
                class="input"
                id="schedule-pickup"
                required
                placeholder="Pickup address"
              />
            </div>

            <div class="field">
              <label for="schedule-drop">Destination</label>

              <input
                class="input"
                id="schedule-drop"
                required
                placeholder="Drop address"
              />
            </div>

            <div class="form-grid">
              <div class="field">
                <label for="schedule-pickup-lat">Pickup latitude</label>
                <input
                  class="input"
                  id="schedule-pickup-lat"
                  type="number"
                  step="any"
                  min="-90"
                  max="90"
                  required
                />
              </div>
              <div class="field">
                <label for="schedule-pickup-lng">Pickup longitude</label>
                <input
                  class="input"
                  id="schedule-pickup-lng"
                  type="number"
                  step="any"
                  min="-180"
                  max="180"
                  required
                />
              </div>
              <div class="field">
                <label for="schedule-drop-lat">Destination latitude</label>
                <input
                  class="input"
                  id="schedule-drop-lat"
                  type="number"
                  step="any"
                  min="-90"
                  max="90"
                  required
                />
              </div>
              <div class="field">
                <label for="schedule-drop-lng">Destination longitude</label>
                <input
                  class="input"
                  id="schedule-drop-lng"
                  type="number"
                  step="any"
                  min="-180"
                  max="180"
                  required
                />
              </div>
              <div class="field">
                <label for="schedule-distance">
                  Approx. road distance (km)
                </label>
                <input
                  class="input"
                  id="schedule-distance"
                  type="number"
                  min="0.1"
                  max="1000"
                  step="0.1"
                  required
                />
              </div>
            </div>
            <div class="form-grid">
              <div class="field">
                <label for="schedule-date">Date</label>

                <input class="input" id="schedule-date" type="date" required />
              </div>

              <div class="field">
                <label for="schedule-time">Time</label>

                <input class="input" id="schedule-time" type="time" required />
              </div>
            </div>

            <div class="field">
              <label for="schedule-vehicle">Vehicle</label>

              <select class="select" id="schedule-vehicle">
                <option value="economy">Economy</option>
                <option value="comfort">Comfort</option>
                <option value="premium">Premium</option>
                <option value="xl">XL</option>
              </select>
            </div>

            <button class="btn btn-primary" type="submit">
              Save scheduled ride
            </button>
          </form>

          <div id="schedule-message"></div>
        </section>

        <section class="card span-5">
          <h2>Heads up</h2>

          <p>
            Your scheduled ride will become available to drivers at the pickup
            time.
          </p>

          <span class="pill">Future date required</span>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <span>Thoughtful journeys, every day. © 2026 Astercab</span>
      </div>
    </footer>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/passenger.js"></script>
  </body>
</html>
