<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Astercab — a better way to move." />
    <title>Sign in | Astercab</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="login">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation"></nav>
        <div class="nav-actions" data-nav-auth></div>
        <button
          class="icon-btn mobile-toggle"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>
    <main class="auth-layout">
      <aside class="auth-visual">
        <div>
          <div class="eyebrow" style="color: var(--accent)">
            Move differently
          </div>
          <h2>Good journeys begin with a little more care.</h2>
          <p>Simple, reliable travel with safety built into the details.</p>
        </div>
        <p class="quote">
          “The city feels smaller when getting there is this easy.”
        </p>
      </aside>
      <section class="auth-main">
        <div class="auth-box">
          <div class="eyebrow">Welcome back</div>
          <h1>Good to see you.</h1>
          <p class="muted">Sign in to continue your journey.</p>
          <form id="login-form">
            <div class="form-group">
              <label for="email">Email address</label>
              <div class="input-wrap">
                <i data-lucide="mail" size="18"></i>
                <input
                  class="input"
                  id="email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  required
                  autocomplete="email"
                />
              </div>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrap">
                <i data-lucide="lock-keyhole" size="18"></i>
                <input
                  class="input"
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  required
                  autocomplete="current-password"
                />
              </div>
            </div>
            <button class="btn btn-primary full" type="submit">
              Sign in
              <i data-lucide="arrow-right" size="18"></i>
            </button>
          </form>
          <p class="form-footer">
            New to Astercab?
            <a href="/register.html">Create an account</a>
          </p>
        </div>
      </section>
    </main>
    <div class="toast-stack" aria-live="polite"></div>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
