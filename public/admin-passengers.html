<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Astercab — a better way to move." />
    <title>Passengers | Astercab</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="admin-passengers">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation"></nav>
        <div class="nav-actions" data-nav-auth></div>
        <button
          class="icon-btn mobile-toggle"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="side-title">Overview</div>
        <a class="side-link" href="/admin-dashboard.html">
          <i data-lucide="layout-dashboard" size="18"></i>
          Dashboard
        </a>
        <div class="side-title">Management</div>
        <a class="side-link" href="/admin-verifications.html">
          <i data-lucide="badge-check" size="18"></i>
          Verifications
        </a>
        <a class="side-link" href="/admin-drivers.html">
          <i data-lucide="car-front" size="18"></i>
          Drivers & vehicles
        </a>
        <a class="side-link" href="/admin-passengers.html">
          <i data-lucide="users" size="18"></i>
          Passengers
        </a>
        <div class="divider"></div>
        <button class="side-link icon-btn" data-logout>
          <i data-lucide="log-out" size="18"></i>
          Sign out
        </button>
      </aside>
      <main class="dashboard-main">
        <div class="dashboard-top">
          <div>
            <div class="eyebrow">People & trust</div>
            <h1>Passengers</h1>
            <p class="muted">Search accounts and manage passenger access.</p>
          </div>
          <div class="inline-row">
            <button
              class="icon-btn dashboard-menu"
              data-menu-toggle
              style="display: none"
              aria-label="Open sidebar"
            >
              <i data-lucide="menu"></i>
            </button>
            <div class="user-chip" data-user-chip></div>
          </div>
        </div>
        <div class="card">
          <div class="toolbar">
            <input
              class="input"
              id="search"
              type="search"
              placeholder="Search by name or email"
              aria-label="Search"
            />
            <select
              class="select"
              id="status-filter"
              style="max-width: 180px"
              aria-label="Filter by status"
            >
              <option value="all">All statuses</option>
              <option value="active">Active</option>
              <option value="blocked">Blocked</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Passenger</th>
                  <th>Contact</th>
                  <th>Joined</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="data-body">
                <tr>
                  <td colspan="5" class="loading">Loading records…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <div class="toast-stack" aria-live="polite"></div>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
