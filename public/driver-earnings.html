<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astercab · Driver</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  </head>
  <body data-page="driver-earnings">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/" aria-label="Astercab home">
          <span class="brand-mark"><i data-lucide="route" size="20"></i></span>
          aster
          <span class="brand-accent">cab</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation"></nav>
        <div class="nav-actions" data-nav-auth></div>
        <button
          class="icon-btn mobile-toggle"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="side-title">Driver workspace</div>
        <nav data-driver-nav></nav>
        <div class="divider"></div>
        <a class="side-link" href="/driver-verification.html">
          <i data-lucide="shield-check"></i>
          Verification
        </a>
        <button class="side-link" data-logout>
          <i data-lucide="log-out"></i>
          Sign out
        </button>
      </aside>
      <main class="dashboard-main">
        <div class="dashboard-top">
          <div>
            <div class="eyebrow">Astercab driver</div>
            <h1 id="driver-title">Earnings</h1>
          </div>
          <div class="user-chip" data-user-chip></div>
        </div>
        <div class="stat-grid">
          <article class="stat-card">
            <div class="stat-top">Gross earnings</div>
            <div class="stat-number" id="earnings-total">—</div>
          </article>
          <article class="stat-card">
            <div class="stat-top">Completed trips</div>
            <div class="stat-number" id="earnings-trips">—</div>
          </article>
        </div>
        <section class="card">
          <h3>Completed trip history</h3>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Ride</th>
                  <th>Pickup</th>
                  <th>Drop-off</th>
                  <th>Fare</th>
                  <th>Completed</th>
                </tr>
              </thead>
              <tbody id="earnings-body">
                <tr>
                  <td colspan="5" class="loading">Loading earnings…</td>
                </tr>
              </tbody>
            </table>
          </div>
          <p class="form-note">
            Gross earnings are calculated from completed rides' final fares.
            Platform fees and payouts are not deducted here.
          </p>
        </section>
      </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/driver.js"></script>
  </body>
</html>
